<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champion Service Floor · Prototype</title>
<meta name="description" content="Champion Motors paperless service floor — the wireframe prototype, rebuilt as working HTML. All data is fictional.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Red+Hat+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* The Champion Motors service-floor wireframe (originally Axure, 2022), rebuilt as one working page.
   Two stations share one state: the mechanic's workstation and the floor manager's board.
   Wireframe look on purpose: greys, black, the yellow plate, and status colors only. All data is fictional. */
:root {
  color-scheme: light;
  --bg: #F3F4F6; --panel: #FFFFFF; --soft: #F1F2F4; --soft-2: #E6E8EB; --line: #E4E6E9; --line-2: #CDD1D6;
  --ink: #16181D; --ink-2: #5B616B; --ink-3: #8E949C;
  --dark: #23262D; --navy: #1E2A5A;
  --plate: #F7D33A; --il: #1F4FB3; --green: #5FA83B; --green-d: #4A8A2B; --red: #D64545; --orange: #E99B2E;
  --scrim: rgba(16,18,24,.42);
  --sh1: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  --sh2: 0 10px 28px -6px rgba(16,24,40,.16), 0 2px 6px rgba(16,24,40,.06);
  --ease: cubic-bezier(.2,.8,.2,1);
  --fh: 'Heebo', 'Arial Hebrew', Arial, sans-serif;
  --fm: 'Red Hat Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--fh); font-size: 14px; line-height: 1.4; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
svg { display: block; flex: none; }
[hidden] { display: none !important; }

/* the frame around the prototype (portfolio context, English) */
.fbar { position: relative; z-index: 30; display: flex; align-items: center; gap: 18px; height: 46px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: #18160F; color: #F2EEE9; font: 500 12px/1.3 var(--fm); letter-spacing: .06em; direction: ltr; }
.fbar a { color: inherit; text-decoration: none; white-space: nowrap; }
.fbar a:hover { text-decoration: underline; }
.roles { margin-left: auto; display: flex; gap: 2px; padding: 2px; border: 1px solid rgba(242,238,233,.28); border-radius: 6px; }
.roles button { padding: 6px 10px; border-radius: 4px; font: 600 11px/1 var(--fm); letter-spacing: .08em; text-transform: uppercase; color: rgba(242,238,233,.8); white-space: nowrap; }
.roles button[aria-pressed="true"] { background: #F2EEE9; color: #18160F; }

#stage { position: relative; height: calc(100% - 46px); overflow: hidden; }
#app { width: 1280px; transform-origin: top right; position: absolute; top: 0; right: 0; }
.narrow-note { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 40; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: #18160F; color: #F2EEE9; font: 500 12px/1.5 var(--fm); direction: ltr; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.narrow-note button { margin-left: auto; padding: 6px 10px; border: 1px solid rgba(242,238,233,.4); border-radius: 6px; font-size: 11px; color: inherit; }

.logo { display: inline-flex; align-items: center; padding: 3px 10px 4px; border: 1.5px solid var(--navy); border-radius: 3px 3px 14px 3px; color: var(--navy); font: 800 15px/1 var(--fh); letter-spacing: .01em; }

/* ── top bars ── */
.top { display: flex; align-items: flex-end; gap: 6px; height: 64px; padding: 0 20px; background: #EAEAEA; border-bottom: 1px solid var(--line); }
.brand { align-self: center; margin-left: 24px; }
.brand small { display: block; margin-top: 3px; color: var(--ink-2); font-size: 11px; }
.ctabs { display: flex; gap: 4px; align-self: flex-end; }
.ctab { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; background: #DCDCDC; }
.ctab.on { background: var(--panel); height: 56px; margin-bottom: -1px; }
.iron { display: grid; place-items: center; width: 32px; height: 32px; background: #6B6B6B; color: #fff; font: 700 18px/1 var(--fh); }
.ctab.on .iron, .mcard .iron { background: var(--dark); }
.cno { font-size: 11px; color: var(--ink-2); line-height: 1.2; }
.cno b { display: block; color: var(--ink); font-size: 12px; }
.plate { display: inline-block; padding: 4px 9px; border: 1.5px solid var(--ink); border-radius: 4px; background: #C9C9C9; font: 700 13px/1 var(--fm); letter-spacing: .02em; direction: ltr; white-space: nowrap; }
.ctab.on .plate, .plate.y { background: var(--plate); }
.plate.big { padding: 6px 12px; font-size: 16px; border-width: 2px; }
.dot-alert { width: 14px; height: 14px; border-radius: 50%; background: var(--red); color: #fff; font: 700 10px/14px var(--fh); text-align: center; }
.newtab { align-self: center; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; }
.newtab:hover, .ibtn:hover { background: rgba(0,0,0,.06); }
.clock { margin-right: auto; align-self: center; display: flex; align-items: center; gap: 14px; color: var(--ink-2); }
.clock b { color: var(--ink); font-size: 17px; }
.ibtn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; position: relative; }
.badge-n { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font: 700 10px/16px var(--fh); text-align: center; }

/* ── workstation ── */
.ws { display: flex; gap: 28px; height: calc(100% - 64px); padding: 22px 24px 22px; background: var(--panel); }
.veh { flex: none; width: 300px; display: flex; flex-direction: column; gap: 0; padding: 14px; border-radius: 16px; background: var(--soft); overflow: auto; }
.veh-head { display: flex; justify-content: space-between; gap: 8px; padding: 2px 4px 12px; font-size: 12px; color: var(--ink-2); }
.veh-head b { display: block; color: var(--ink); }
.late { display: inline-flex; align-items: center; gap: 4px; }
.flags { display: flex; gap: 4px; align-items: flex-start; }
.flag { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--ink-2); }
.flag[data-on="false"] { opacity: .25; }
.veh-card { padding: 12px 14px 14px; border-radius: 10px; background: var(--panel); }
.veh-card .row { display: flex; justify-content: space-between; align-items: center; }
.wbadge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 10px; background: var(--green); color: #fff; font-size: 11px; font-weight: 700; }
.wbadge.no { background: #9E9E9E; }
.keycode { display: inline-flex; align-items: center; gap: 6px; font: 700 13px/1 var(--fm); direction: ltr; }
.car { text-align: center; padding: 12px 0 10px; }
.mark { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 8px; border: 2.5px solid var(--ink); border-radius: 50%; font: 800 15px/1 var(--fh); letter-spacing: -.02em; direction: ltr; }
.car h2 { margin: 0; font-size: 26px; font-weight: 800; direction: ltr; }
.car p { margin: 2px 0 0; font-size: 17px; direction: ltr; }
.loc { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.loc b { color: var(--ink); }
.loc form { display: flex; gap: 6px; }
.loc input { width: 150px; padding: 4px 6px; border: 1px solid var(--line-2); border-radius: 4px; font-size: 12px; }
.mini-btn { padding: 4px 8px; border-radius: 4px; background: var(--dark); color: #fff; font-size: 11px; font-weight: 600; }
.mini-btn.ghost { background: none; color: var(--ink-2); border: 1px solid var(--line-2); }
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-2); }
.people b { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
.phone-pop { position: relative; }
.pop { position: absolute; top: 24px; right: 0; z-index: 5; width: 190px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 6px 18px rgba(0,0,0,.14); font-size: 12px; color: var(--ink-2); }
.pop div { display: flex; justify-content: space-between; padding: 3px 0; }
.pop span { color: var(--ink); font-family: var(--fm); direction: ltr; }
.veh-meta { padding: 12px 4px 0; font-size: 12px; color: var(--ink-2); }
.veh-meta .last { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.veh-meta .last b { color: var(--ink); }
.linkish { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; color: var(--ink); font-weight: 700; font-size: 12px; }
.linkish:hover { text-decoration: underline; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; padding-top: 12px; }
.kv b { display: block; color: var(--ink); font-size: 13px; }
.kv .mono { font-family: var(--fm); font-size: 12px; direction: ltr; text-align: right; }
.full-btn { align-self: center; margin-top: 16px; padding: 8px 26px; border: 1px solid var(--line-2); border-radius: 18px; background: var(--panel); font-size: 13px; }
.full-btn:hover, .pill-btn:hover { background: var(--soft); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wtabs { display: flex; align-items: center; gap: 26px; padding: 6px 4px 0; border-bottom: 1px solid var(--line); }
.wtab { padding: 8px 2px 10px; color: var(--ink-2); font-size: 15px; border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
.wtab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-color: var(--ink); }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid var(--line-2); border-radius: 16px; font-size: 13px; }
.wtabs .pill-btn { margin-right: auto; }
.pane { flex: 1; min-height: 0; overflow: auto; padding-top: 12px; }
.req-tools { display: flex; gap: 22px; padding: 10px 4px 14px; font-size: 13px; }
.req-tools button { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.req-tools button:hover { text-decoration: underline; }
.reqs { border-top: 1px solid var(--line); }
.req { border-bottom: 1px solid var(--line); }
.req.done { background: #F3F3F3; }
.req-row { display: grid; grid-template-columns: 32px 220px minmax(0, 1fr) 100px 30px 30px; align-items: center; gap: 12px; min-height: 64px; padding: 8px 10px; }
.check { width: 20px; height: 20px; border: 2px solid var(--ink-2); border-radius: 3px; display: grid; place-items: center; background: var(--panel); }
.req.done .check { background: var(--dark); border-color: var(--dark); color: #fff; }
.rt { font-weight: 700; font-size: 15px; }
.rt small { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--ink-3); font-weight: 400; font-size: 11px; }
.rd { padding-right: 12px; border-right: 1px solid var(--line); font-size: 13px; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 3px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; }
.tag.ext { padding: 3px 10px; border-radius: 4px; background: var(--dark); font-size: 12px; }
.ok-badge { justify-self: start; display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 4px; background: var(--green); color: #fff; font-size: 10px; font-weight: 700; white-space: nowrap; }
.ok-badge.wait { background: #9E9E9E; }
.ricon { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; color: var(--ink-2); }
.ricon:hover { background: var(--soft); }
.ricon:disabled { cursor: default; background: none; }
.ricon i { position: absolute; top: 0; left: 0; min-width: 14px; height: 14px; border-radius: 7px; background: var(--ink); color: #fff; font: 700 9px/14px var(--fh); font-style: normal; text-align: center; }
.rnotes { padding: 0 54px 10px 10px; }
.rnote { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 12px; }
.av { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #8C8C8C; color: #fff; font-size: 11px; font-weight: 700; flex: none; }
.av.lg { width: 36px; height: 36px; font-size: 14px; }
.rnote b { font-size: 12px; }
.rnote span { color: var(--ink-3); }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 8px 10px; background: var(--soft); color: var(--ink-2); font-size: 11px; font-weight: 500; text-align: right; }
.tbl td { padding: 16px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.b { font-weight: 700; }
.tbl td small { display: block; color: var(--ink-2); font-size: 11px; font-weight: 400; }
.tbl .mono { font-family: var(--fm); font-size: 12px; direction: ltr; text-align: right; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 9px; background: var(--dark); color: #fff; font-size: 10px; font-weight: 700; }
.chip.alt { background: #CFCFCF; color: var(--ink); }
.st { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 700; }
.st span { padding: 1px 8px; border-radius: 8px; color: #fff; background: var(--green); }
.st.wait span { background: var(--orange); }
.st.off span { background: #9E9E9E; }
.empty { padding: 40px 0; color: var(--ink-3); text-align: center; }

.actions { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 18px; }
.act-start { display: flex; align-items: flex-end; gap: 22px; }
.who { display: block; margin-bottom: 4px; color: var(--ink-2); font-size: 11px; text-align: center; }
.big-btn { display: inline-flex; align-items: center; gap: 10px; min-width: 210px; justify-content: center; padding: 13px 28px; border-radius: 24px; background: var(--green); color: #fff; font-size: 17px; font-weight: 700; }
.big-btn.stop { background: var(--red); }
.big-btn.grey { min-width: 160px; background: #5C5C5C; }
.big-btn:disabled { opacity: .45; cursor: not-allowed; }
.add-worker { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 14px; color: var(--ink-2); font-size: 12px; }
.add-worker:hover { color: var(--ink); text-decoration: underline; }

/* ── job search ── */
.search { height: calc(100% - 64px); padding-top: 120px; background: var(--panel); text-align: center; }
.search h2 { margin: 0 0 18px; font-size: 28px; font-weight: 600; }
.sfield { display: flex; align-items: center; gap: 10px; width: 440px; margin: 0 auto; padding: 8px 16px; border: 1px solid var(--line-2); border-radius: 22px; }
.sfield input { flex: 1; border: 0; outline: 0; background: none; font-size: 14px; }
.results { width: 520px; margin: 26px auto 0; text-align: right; }
.result { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 18px; width: 100%; padding: 14px 10px; border-bottom: 1px solid var(--line); }
.result:hover { background: var(--soft); }
.result .mark { width: 38px; height: 38px; margin: 0; font-size: 11px; border-width: 2px; }
.result .model { font-weight: 700; direction: ltr; text-align: left; }
.result .model small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-2); }
.hint { margin-top: 14px; color: var(--ink-3); font-size: 12px; }

/* ── manager ── */
.mtop .stabs { display: flex; gap: 4px; align-self: flex-end; }
.stab { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 22px; border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; background: #DCDCDC; color: var(--ink-2); font-size: 14px; }
.stab[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 700; height: 48px; margin-bottom: -1px; }
.cnt { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 700; }
.views { display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: #D2D2D2; }
.views button { display: grid; place-items: center; width: 28px; height: 24px; border-radius: 4px; color: var(--ink-2); }
.views button[aria-pressed="true"] { background: #8A8A8A; color: #fff; }
.board { position: relative; height: calc(100% - 64px); background: var(--panel); }
.lane { display: flex; gap: 26px; height: 100%; padding: 22px 24px 120px; overflow-x: auto; overflow-y: hidden; }
.lane.grid { flex-wrap: wrap; overflow-y: auto; align-content: flex-start; }
.slot { flex: none; width: 292px; }
.slot > .pn { margin: 0 4px 6px; color: var(--ink-3); font-size: 15px; }
.mcard { position: relative; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.mcard .plate { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); }
.mc-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 12px 8px; }
.mc-id { display: flex; gap: 8px; align-items: center; }
.mc-id .cno small { display: block; color: var(--ink-3); font-size: 10px; }
.mc-times { display: flex; justify-content: space-between; padding: 6px 12px 10px; font-size: 12px; color: var(--ink-2); }
.mc-times b { color: var(--ink); }
.mc-car { margin: 0 8px; padding: 10px 10px 8px; border-radius: 4px; background: var(--soft); }
.mc-car .row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-2); }
.mc-car .car { padding: 6px 0 4px; }
.mc-car .mark { width: 40px; height: 40px; font-size: 12px; border-width: 2px; margin-bottom: 4px; }
.mc-car .car h2 { font-size: 19px; }
.mc-car .car p { font-size: 13px; }
.mc-reqs { position: relative; height: 150px; overflow: hidden; padding: 4px 12px 0; }
.mc-reqs::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(transparent, var(--panel)); }
.mc-req { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--ink-2); }
.mc-req b { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 12px; }
.mc-req.done b { text-decoration: line-through; color: var(--ink-3); }
.mc-foot { display: flex; gap: 8px; padding: 10px 12px 12px; }
.mc-foot button { flex: 1; padding: 7px 0; border-radius: 16px; font-size: 12px; }
.mc-foot .o { border: 1px solid var(--line-2); }
.mc-foot .o:hover { background: var(--soft); }
.mc-foot .f { background: #8A8A8A; color: #fff; }
.mc-foot .f.g { background: var(--green); }
.mc-foot .f:hover { filter: brightness(.92); }
.mc-state { display: flex; align-items: center; gap: 8px; margin: 8px 12px 0; padding: 7px 10px; border-radius: 4px; background: #FFF4E0; font-size: 12px; }
.mc-state.ok { background: #E9F4E1; }
.mc-state .av { width: 22px; height: 22px; font-size: 10px; }

.drawer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; }
.dtabs { display: flex; gap: 2px; padding: 0 24px; direction: ltr; justify-content: flex-start; }
.dtab { padding: 5px 16px; border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; background: #E0E0E0; color: var(--ink-2); font-size: 12px; }
.dtab[aria-selected="true"] { background: #6E6E6E; color: #fff; font-weight: 700; }
.dbody { display: flex; gap: 6px; height: 96px; padding: 12px 24px; overflow-x: auto; background: #E6E6E6; border-top: 1px solid var(--line); }
.drawer.assign .dbody { background: #FFF4D6; }
.assign-msg { position: absolute; bottom: 104px; right: 24px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 13px; }
.assign-msg button { color: #fff; text-decoration: underline; font-size: 12px; }
.wk { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 80px; font-size: 11px; }
.wk .av { position: relative; width: 44px; height: 44px; font-size: 14px; background: #9A9A9A; }
.wk .av::after { content: ""; position: absolute; top: 0; right: 0; width: 11px; height: 11px; border: 2px solid #E6E6E6; border-radius: 50%; background: var(--green); }
.wk[data-s="busy"] .av::after { background: var(--orange); }
.wk[data-s="alert"] .av::after { background: var(--red); }
.wk b { font-size: 12px; white-space: nowrap; }
.wk small { color: var(--ink-3); }
.drawer.assign .wk[data-s="free"] .av { outline: 2px dashed var(--ink); outline-offset: 2px; }
.drawer.assign .wk[data-s="busy"] { opacity: .45; }
.station { flex: none; width: 150px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); font-size: 12px; }
.station b { display: block; }
.station small { color: var(--ink-3); }
.notif { position: absolute; top: 58px; left: 70px; z-index: 12; width: 330px; max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 10px 28px rgba(0,0,0,.18); }
.notif h3 { margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
.ni { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }

    if (!d.canAssign) toast('רק כרטיס שלפני כניסה או ממתין אפשר להכניס לעבודה');
    else if (w.s !== 'free') toast(w.n + ' לא פנוי/ה כרגע');
    else { c.status = 'work'; c.worker = w.n; w.s = 'busy'; toast('כרטיס ' + c.iron + ' הוכנס לעבודה · ' + w.n); }
  } else if (moved) toast('העדיפות עודכנה · כרטיס ' + c.iron + ' במקום ' + (irons.indexOf(c.iron) + 1));
  render();
}
function fit() {
  var w = stage.clientWidth, h = stage.clientHeight, z = Math.min(1, w / 1280);
  app.style.transform = z < 1 ? 'scale(' + z + ')' : '';
  app.style.height = (h / z) + 'px';
  app.style.width = Math.min(Math.max(1280, w), 1680) + 'px';
  app.style.right = w > 1680 ? ((w - 1680) / 2) + 'px' : '0';
  var note = stage.querySelector('.narrow-note');
  if (w < 760 && !S.narrowDismissed && !note) {
    note = document.createElement('div'); note.className = 'narrow-note';
    note.innerHTML = '<span>Built for the workshop\'s large touch screens. It works here too, but it reads best on a desktop or tablet.</span><button type="button">OK</button>';
    note.querySelector('button').onclick = function () { S.narrowDismissed = true; note.remove(); };
    stage.appendChild(note);
  }
}
addEventListener('resize', fit);
if (location.hash === '#manager') { S.role = 'app'; S.view = 'mgr'; } else if (location.hash === '#mechanic') { S.role = 'app'; S.view = 'ws'; }
render(); fit();
// opened from the case study in its own tab: "back" closes this tab, so the case isn't opened twice
var back = document.querySelector('.fbar a');
if (back) back.addEventListener('click', function (e) {
  if (history.length > 1) return;
  e.preventDefault(); window.close();
  setTimeout(function () { location.href = back.href; }, 150);   // if the browser won't close it, go back to the case here
});
setInterval(function () { if (!modal) { var b = app.querySelector('.clock b'); if (b) b.textContent = now(); } }, 20000);
})();
</script>
